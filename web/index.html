<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find and get notified about verified scholarships, fellowships, internships, and grants from recognized institutions worldwide.">
  <meta name="theme-color" content="#12234A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ScholarSphere">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ScholarSphere</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #12234A;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #app-splash svg { width: 96px; height: 96px; }
    #app-splash .ring {
      position: absolute;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      border: 3px solid rgba(234, 242, 255, 0.18);
      border-top-color: #EAA624;
      animation: app-splash-spin 0.9s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .ring { animation: none; }
    }
    @keyframes app-splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="presentation">
    <div class="ring"></div>
    <svg viewBox="0 0 512 512" aria-label="ScholarSphere">
      <defs>
        <radialGradient id="splashGlobeGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#5B9CF6"/>
          <stop offset="55%" stop-color="#2563EB"/>
          <stop offset="100%" stop-color="#153A8B"/>
        </radialGradient>
        <linearGradient id="splashCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FDE68A"/>
          <stop offset="100%" stop-color="#EAA624"/>
        </linearGradient>
        <clipPath id="splashGlobeClip">
          <circle cx="256" cy="292" r="140"/>
        </clipPath>
      </defs>
      <circle cx="256" cy="292" r="140" fill="url(#splashGlobeGrad)"/>
      <g clip-path="url(#splashGlobeClip)" stroke="#EAF2FF" stroke-opacity="0.45" stroke-width="3" fill="none">
        <ellipse cx="256" cy="292" rx="46.7" ry="140"/>
        <ellipse cx="256" cy="292" rx="93.3" ry="140"/>
        <line x1="134.8" y1="222" x2="377.2" y2="222"/>
        <line x1="116" y1="292" x2="396" y2="292"/>
        <line x1="134.8" y1="362" x2="377.2" y2="362"/>
      </g>
      <circle cx="256" cy="292" r="140" fill="none" stroke="#EAF2FF" stroke-opacity="0.55" stroke-width="3"/>
      <ellipse cx="256" cy="207" rx="38" ry="17" fill="#0E1B38"/>
      <path d="M256,172 C300,182 312,206 306,238" fill="none" stroke="#EAA624" stroke-width="4" stroke-linecap="round"/>
      <g stroke="#EAA624" stroke-width="4" stroke-linecap="round">
        <line x1="306" y1="238" x2="298" y2="256"/>
        <line x1="306" y1="238" x2="308" y2="257"/>
        <line x1="306" y1="238" x2="316" y2="254"/>
      </g>
      <polygon points="256,131 366,172 256,213 146,172" fill="url(#splashCapGrad)" stroke="#B4780E" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="256" cy="172" r="8" fill="#B4780E"/>
      <circle cx="368" cy="398" r="38" fill="#FFFFFF"/>
      <circle cx="368" cy="398" r="38" fill="none" stroke="#12234A" stroke-width="4"/>
      <path d="M350,398 L362,411 L388,383" fill="none" stroke="#16A34A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <script>
    (function () {
      var removed = false;
      function removeSplash() {
        if (removed) return;
        removed = true;
        var el = document.getElementById('app-splash');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 350);
      }
      window.addEventListener('flutter-first-frame', removeSplash);
      // Safety net in case the engine doesn't fire the event (e.g. older builds).
      setTimeout(removeSplash, 10000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
