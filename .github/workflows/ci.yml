name: ScholarSphere CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze
      - name: Automated tests
        run: flutter test --coverage
      - name: Build web artifact
        run: flutter build web --release
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: scholarsphere-web
          path: build/web
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scholarsphere_backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scholarsphere_backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # tests/test_browser_rendering.py's real-browser tests
      # (app/services/browser_rendering.py) skip cleanly if this step is
      # ever removed - installed here so they actually run in CI, not just
      # locally in a dev environment that happens to have a browser.
      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium
      - name: Run tests
        run: pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dependency vulnerability audit
        # audit-level=high: a moderate finding in firebase-admin's own
        # nested `uuid` dependency (GHSA-w5hq-g745-h8pq, low practical risk
        # here -- see docs/PRODUCTION_SECURITY_AUDIT.md) has no upstream fix
        # yet and would otherwise fail every build until Google patches it.
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
