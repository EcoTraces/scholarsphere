name: Diagnose pending-verification queue mismatch

# Temporary, read-only diagnostic: the Verification Officer dashboard shows
# a large "Pending Verification" count while the live queue screen says
# "The verification queue is clear." Runs
# scripts/diagnose_pending_queue.py (SELECT-only) against production to
# find out why, then this workflow (and the script) get deleted once the
# real fix is confirmed and shipped.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scholarsphere_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scholarsphere_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Diagnose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/diagnose_pending_queue.py
