name: Verify funding/application-link fix data

# Temporary, read-only: confirms the live funding_type and URL data
# behind the "always partially funded" / "duplicate application link"
# fixes for the 3 verified+published opportunities. Deleted, along
# with the script, once the answer is read.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scholarsphere_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scholarsphere_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/verify_fixes_live_data.py
