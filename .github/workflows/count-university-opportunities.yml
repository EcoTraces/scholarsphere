name: Count university-source opportunities

# Temporary, read-only: answers "how many live opportunity records come
# from a direct university source" by running
# scripts/count_university_opportunities.py (SELECT-only) against
# production. Deleted, along with the script, once the answer is read.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scholarsphere_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scholarsphere_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Count
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/count_university_opportunities.py
