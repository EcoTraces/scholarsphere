name: List verified university-source opportunities

# Temporary, read-only follow-up to the university-source opportunity
# count: names the specific records that are verified + published.
# Deleted, along with the script, once the answer is read.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scholarsphere_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scholarsphere_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: List
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/list_verified_university_opportunities.py
