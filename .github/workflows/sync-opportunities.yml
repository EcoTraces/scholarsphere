name: Sync opportunities

# Runs the real source-collection pipeline (scholarsphere_backend/scripts/
# sync_all_sources.py) against the production database on a schedule.
# Render's free-tier web service (render.yaml) cannot run a Celery
# worker/beat process, so without this, none of the 109 registered
# scholarship/grant sources ever get collected in production - see
# docs/DEPLOYMENT_FREE_TIER.md. A GitHub-hosted runner has normal outbound
# internet access, so it can reach every source site directly.
#
# Import only - never verifies or publishes anything. New candidates still
# require a human verification officer's review in the app before an
# applicant can see them.

on:
  workflow_dispatch: {}
  schedule:
    # 03:17 UTC daily - off the hour, to avoid piling onto GitHub's
    # top-of-hour scheduling load.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scholarsphere_backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scholarsphere_backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium
      - name: Sync all sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIMPLER_GRANTS_API_KEY: ${{ secrets.SIMPLER_GRANTS_API_KEY }}
        run: python scripts/sync_all_sources.py
