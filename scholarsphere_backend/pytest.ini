[pytest]
asyncio_mode = auto
testpaths = tests
# The plain `pytest` console-script entry point (unlike `python -m pytest`)
# does not add the current directory to sys.path, so `import app...` in
# conftest.py/tests fails with "ModuleNotFoundError: No module named 'app'"
# when CI (or any contributor) runs bare `pytest` from scholarsphere_backend/
# instead of `python -m pytest`. This makes both invocations work the same.
pythonpath = .
